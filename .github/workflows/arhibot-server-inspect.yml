name: Arhibot server inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arhibot-server-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - name: Require SSH access
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing ${name}" >&2; exit 1; }
          done
          echo "DEPLOY_SSH_PORT=${DEPLOY_SSH_PORT:-22}" >> "${GITHUB_ENV}"

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect arhibot target
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh -p "${DEPLOY_SSH_PORT}" "${remote}" bash -s <<'REMOTE'
          set -Eeuo pipefail
          echo "HOST_OK=1"
          echo "DOCKER=$(docker --version 2>/dev/null || echo missing)"
          if docker compose version >/dev/null 2>&1; then
            echo "COMPOSE=docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "COMPOSE=docker-compose"
          else
            echo "COMPOSE=missing"
          fi

          if [[ -d /root/arhibot ]]; then
            echo "ARHIBOT_DIR=present"
          else
            echo "ARHIBOT_DIR=missing"
          fi

          env_file=/root/arhibot/backend/.env
          if [[ -f "${env_file}" ]]; then
            echo "ARHIBOT_ENV=present"
            for key in TELEGRAM_BOT_TOKEN TELEGRAM_WEBAPP_URL JWT_SECRET REFRESH_TOKEN_SECRET; do
              if grep -qE "^${key}=.+" "${env_file}"; then
                echo "${key}=SET"
              else
                echo "${key}=MISSING_OR_EMPTY"
              fi
            done
          else
            echo "ARHIBOT_ENV=missing"
          fi

          echo "ARHIBOT_CONTAINERS_BEGIN"
          docker ps --format '{{.Names}} {{.Status}} {{.Ports}}' | grep -E 'arhibot|18000|18080' || true
          echo "ARHIBOT_CONTAINERS_END"
          REMOTE
