name: Arhibot ACME debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arhibot-acme-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DOMAIN_ASCII: archibot.xn--e1aikcel5c5a.online
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "DEPLOY_SSH_PORT=${DEPLOY_SSH_PORT:-22}" >> "${GITHUB_ENV}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Probe ACME path
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh -p "${DEPLOY_SSH_PORT}" "${remote}" bash -s -- "${DOMAIN_ASCII}" <<'REMOTE'
          set -Eeuo pipefail
          domain="$1"
          mkdir -p /var/www/certbot/.well-known/acme-challenge
          printf 'archibot-acme-ok\n' > /var/www/certbot/.well-known/acme-challenge/arhibot-probe
          echo 'CONTAINER_FILE_BEGIN'
          docker exec artflow-nginx-1 sh -c 'ls -l /var/www/certbot/.well-known/acme-challenge/arhibot-probe && cat /var/www/certbot/.well-known/acme-challenge/arhibot-probe' || true
          echo 'CONTAINER_FILE_END'
          echo 'ACTIVE_BLOCK_BEGIN'
          docker exec artflow-nginx-1 nginx -T 2>&1 | grep -A12 -B2 "server_name ${domain}" || true
          echo 'ACTIVE_BLOCK_END'
          echo "LOCAL_HOST_STATUS=$(curl -sS -o /tmp/local-probe -w '%{http_code}' -H "Host: ${domain}" http://127.0.0.1/.well-known/acme-challenge/arhibot-probe || true)"
          echo "LOCAL_BODY=$(cat /tmp/local-probe 2>/dev/null || true)"
          echo "PUBLIC_STATUS=$(curl -sS -o /tmp/public-probe -w '%{http_code}' "http://${domain}/.well-known/acme-challenge/arhibot-probe" || true)"
          echo "PUBLIC_BODY=$(cat /tmp/public-probe 2>/dev/null || true)"
          REMOTE
