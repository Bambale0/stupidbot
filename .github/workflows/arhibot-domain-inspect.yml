name: Arhibot domain inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arhibot-domain-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing ${name}" >&2; exit 1; }
          done
          echo "DEPLOY_SSH_PORT=${DEPLOY_SSH_PORT:-22}" >> "${GITHUB_ENV}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect reverse proxy names
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh -p "${DEPLOY_SSH_PORT}" "${remote}" bash -s <<'REMOTE'
          set -Eeuo pipefail
          echo "NGINX_SERVER_NAMES_BEGIN"
          for container in $(docker ps --format '{{.Names}}' | grep -i nginx || true); do
            echo "[$container]"
            docker exec "$container" nginx -T 2>&1 \
              | grep -E '^[[:space:]]*server_name[[:space:]]+' \
              | sed -E 's/^[[:space:]]+//' \
              | sort -u || true
          done
          echo "NGINX_SERVER_NAMES_END"

          echo "NGINX_MOUNTS_BEGIN"
          for container in $(docker ps --format '{{.Names}}' | grep -i nginx || true); do
            echo "[$container]"
            docker inspect "$container" --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{println}}{{end}}' || true
          done
          echo "NGINX_MOUNTS_END"
          REMOTE
