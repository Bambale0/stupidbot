name: Arhibot domain readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arhibot-domain-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DOMAIN_ASCII: archibot.xn--e1aikcel5c5a.online
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing ${name}" >&2; exit 1; }
          done
          echo "DEPLOY_SSH_PORT=${DEPLOY_SSH_PORT:-22}" >> "${GITHUB_ENV}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check DNS and TLS prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh -p "${DEPLOY_SSH_PORT}" "${remote}" bash -s -- "${DOMAIN_ASCII}" <<'REMOTE'
          set -Eeuo pipefail
          domain="$1"
          echo "DOMAIN=${domain}"
          echo "DNS_BEGIN"
          getent ahostsv4 "${domain}" | awk '{print $1}' | sort -u || true
          echo "DNS_END"
          echo "CERTBOT=$(command -v certbot || true)"
          echo "CERT_NAMES_BEGIN"
          if [[ -d /etc/letsencrypt/live ]]; then
            find /etc/letsencrypt/live -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
          fi
          echo "CERT_NAMES_END"
          echo "HTTP_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 "http://${domain}/" || true)"
          echo "HTTPS_STATUS=$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 8 "https://${domain}/" || true)"
          REMOTE
