name: Release certification

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full candidate SHA
        required: true
      pull_request_number:
        description: Release pull request number
        required: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: release-certification-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  certify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      RELEASE_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Certify exact SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod 700 ops/certify_release.sh
          ops/certify_release.sh \
            "${GITHUB_REPOSITORY}" \
            "${CANDIDATE_SHA}" \
            "${RELEASE_PR_NUMBER}" \
            17 \
            release-evidence.json

      - name: Validate certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e --arg sha "${CANDIDATE_SHA}" '
            .status == "certified"
            and .candidate_sha == $sha
            and ([.checks[].status] | all(. == "passed"))
          ' release-evidence.json >/dev/null

      - name: Upload exact-SHA certificate
        uses: actions/upload-artifact@v4
        with:
          name: release-certificate-${{ env.CANDIDATE_SHA }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 90
