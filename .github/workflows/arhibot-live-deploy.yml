name: Arhibot live deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arhibot-live-deploy.yml'
      - 'ops/arhibot-deploy.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arhibot-live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DOMAIN_ASCII: archibot.xn--e1aikcel5c5a.online
    steps:
      - name: Checkout deploy helper
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing ${name}" >&2; exit 1; }
          done
          echo "DEPLOY_SSH_PORT=${DEPLOY_SSH_PORT:-22}" >> "${GITHUB_ENV}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Download arhibot main
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://github.com/Bambale0/arhibot/archive/refs/heads/main.tar.gz -o /tmp/arhibot-main.tar.gz
          tar -tzf /tmp/arhibot-main.tar.gz >/dev/null

      - name: Transfer release and deploy helper
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          scp -P "${DEPLOY_SSH_PORT}" /tmp/arhibot-main.tar.gz ops/arhibot-deploy.sh "${remote}:/tmp/"

      - name: Deploy to archibot domain
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh -p "${DEPLOY_SSH_PORT}" "${remote}" bash /tmp/arhibot-deploy.sh "${DOMAIN_ASCII}"
