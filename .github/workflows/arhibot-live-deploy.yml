name: Arhibot live deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arhibot-live-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arhibot-live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DOMAIN_ASCII: archibot.xn--e1aikcel5c5a.online
    steps:
      - name: Checkout arhibot
        uses: actions/checkout@v7
        with:
          repository: Bambale0/arhibot
          ref: main
          path: arhibot
          fetch-depth: 1

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing ${name}" >&2; exit 1; }
          done
          echo "DEPLOY_SSH_PORT=${DEPLOY_SSH_PORT:-22}" >> "${GITHUB_ENV}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package and transfer
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -czf /tmp/arhibot.tgz -C arhibot .
          scp -P "${DEPLOY_SSH_PORT}" /tmp/arhibot.tgz "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}:/tmp/arhibot.tgz"

      - name: Deploy stack and domain
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh -p "${DEPLOY_SSH_PORT}" "${remote}" bash -s -- "${DOMAIN_ASCII}" <<'REMOTE'
          set -Eeuo pipefail
          domain="$1"
          app_dir="$HOME/arhibot"
          env_backup="/tmp/arhibot.env.backup"

          if [[ -f "${app_dir}/backend/.env" ]]; then
            cp "${app_dir}/backend/.env" "${env_backup}"
          fi
          rm -rf "${app_dir}"
          mkdir -p "${app_dir}"
          tar -xzf /tmp/arhibot.tgz -C "${app_dir}"
          rm -f /tmp/arhibot.tgz
          if [[ -f "${env_backup}" ]]; then
            cp "${env_backup}" "${app_dir}/backend/.env"
          fi

          cd "${app_dir}/backend"

          set_key() {
            key="$1"; value="$2"; file=.env
            if grep -qE "^${key}=" "${file}" 2>/dev/null; then
              sed -i "s|^${key}=.*|${key}=${value}|" "${file}"
            else
              printf '%s=%s\n' "${key}" "${value}" >> "${file}"
            fi
          }

          if [[ ! -f .env ]]; then
            touch .env
            chmod 600 .env
            set_key JWT_SECRET "$(openssl rand -hex 32)"
            set_key REFRESH_TOKEN_SECRET "$(openssl rand -hex 32)"
          fi

          set_key APP_ENV production
          set_key APP_NAME "AI Architecture Platform API"
          set_key APP_VERSION 0.3.0
          set_key API_V1_PREFIX /api/v1
          set_key LOG_LEVEL INFO
          set_key DATABASE_URL 'postgresql+asyncpg://app:app@postgres:5432/app'
          set_key REDIS_URL 'redis://redis:6379/0'
          set_key CORS_ORIGINS "https://${domain}"
          set_key JWT_ALGORITHM HS256
          set_key JWT_ISSUER ai-architecture-platform
          set_key JWT_AUDIENCE ai-architecture-api
          set_key ACCESS_TOKEN_TTL_SECONDS 900
          set_key REFRESH_TOKEN_TTL_SECONDS 2592000
          set_key TELEGRAM_WEBAPP_URL "https://${domain}"
          set_key TELEGRAM_INIT_DATA_TTL_SECONDS 3600
          set_key MEDIA_ROOT /data/media
          set_key MEDIA_PUBLIC_BASE_URL "https://${domain}"
          set_key MAX_IMAGE_SIZE_BYTES 20971520
          set_key MAX_IMAGE_PIXELS 80000000
          set_key FRONTEND_APP_NAME ArchiAI
          set_key VITE_DEMO_GENERATION true
          chmod 600 .env

          docker compose up -d postgres redis
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U app -d app >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker compose run --rm api alembic upgrade head
          docker compose up -d --build api frontend nginx

          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/health/live >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/health/live >/dev/null

          docker network connect arhibot_default artflow-nginx-1 2>/dev/null || true
          nginx_conf=$(docker inspect artflow-nginx-1 --format '{{range .Mounts}}{{if eq .Destination "/etc/nginx/conf.d/default.conf"}}{{.Source}}{{end}}{{end}}')
          [[ -n "${nginx_conf}" && -f "${nginx_conf}" ]] || { echo 'Cannot locate central nginx config' >&2; exit 1; }
          cp "${nginx_conf}" "${nginx_conf}.bak.$(date +%Y%m%d%H%M%S)"

          strip_block() {
            awk '
              /^# BEGIN ARHIBOT MANAGED$/ {skip=1; next}
              /^# END ARHIBOT MANAGED$/ {skip=0; next}
              !skip {print}
            ' "${nginx_conf}" > "${nginx_conf}.tmp"
            mv "${nginx_conf}.tmp" "${nginx_conf}"
          }

          strip_block
          cat >> "${nginx_conf}" <<EOF

# BEGIN ARHIBOT MANAGED
server {
    listen 80;
    server_name ${domain};
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://\$host\$request_uri; }
}
# END ARHIBOT MANAGED
EOF
          docker exec artflow-nginx-1 nginx -t
          docker exec artflow-nginx-1 nginx -s reload

          certbot certonly --webroot -w /var/www/certbot -d "${domain}" \
            --non-interactive --agree-tos --register-unsafely-without-email --keep-until-expiring

          strip_block
          cat >> "${nginx_conf}" <<EOF

# BEGIN ARHIBOT MANAGED
server {
    listen 80;
    server_name ${domain};
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://\$host\$request_uri; }
}
server {
    listen 443 ssl;
    server_name ${domain};
    ssl_certificate /etc/letsencrypt/live/${domain}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${domain}/privkey.pem;
    client_max_body_size 21m;
    location / {
        proxy_pass http://arhibot-nginx-1:80;
        proxy_http_version 1.1;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
# END ARHIBOT MANAGED
EOF
          docker exec artflow-nginx-1 nginx -t
          docker exec artflow-nginx-1 nginx -s reload

          curl -fsS --max-time 10 "https://${domain}/health/live" >/dev/null
          curl -fsS --max-time 10 -o /dev/null "https://${domain}/"
          echo "PUBLIC_URL=https://${domain}"
          echo "ARHIBOT_SHA=$(git -C "${app_dir}" rev-parse HEAD 2>/dev/null || echo packaged-main)"
          docker compose ps
          REMOTE
