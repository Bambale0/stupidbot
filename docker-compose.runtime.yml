name: stupidbot
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stupidbot
      POSTGRES_USER: stupidbot
      POSTGRES_PASSWORD: c49d28989d21db5b73c058db263fcd8d7a950608c8782b4b
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stupidbot -d stupidbot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "53152443f4dd65b2e7addab765626e63cde039407ead02a8"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "53152443f4dd65b2e7addab765626e63cde039407ead02a8", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redis_data:/data
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: stupidbot:runtime
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
